name: Daily SEO Audit

# Crawls the site, scores SEO, commits a dated report, opens an issue for
# critical findings, and opens a PR with safe automated fixes.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: maintenance
        run: npm install --no-audit --no-fund

      - name: Run SEO audit
        id: seo
        working-directory: maintenance
        run: node seo-audit.js

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/seo/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(seo): daily audit report $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Open issue for critical findings
        if: steps.seo.outputs.critical != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('reports/seo/latest.json', 'utf8'));
            const title = `🔴 SEO: ${data.counts.critical} critical issue(s) detected`;
            const lines = [
              `**SEO score:** ${data.score}/100 (gate ${data.gate})`,
              `**Critical:** ${data.counts.critical} · **High:** ${data.counts.high} · **Recommended:** ${data.counts.recommended}`,
              '',
              '### Critical findings',
              ...data.critical.slice(0, 50).map(c => `- \`${c.page}\` — ${c.message}`),
              '',
              `Full report: \`reports/seo/${data.date}.md\``,
            ];
            const body = lines.join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'seo,automated',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['seo', 'automated', 'critical'],
              });
            }

      - name: Open PR with safe automated fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="bot/seo-autofix"
          node maintenance/autofix.js --apply
          if git diff --quiet; then
            echo "No safe fixes to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "fix(seo): apply safe automated fixes (canonical, lang, viewport)"
          git push -f origin "$BRANCH"
          if gh pr list --head "$BRANCH" --state open | grep -q .; then
            echo "PR already open."
          else
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "fix(seo): safe automated fixes" \
              --body "Automated, deterministic SEO/accessibility fixes (missing canonical tags, \`<html lang>\`, viewport meta). Generated by the daily SEO audit. Review before merge."
          fi
